[package]
name = "product-quantization-vector-search"
version = "0.1.0"
edition = "2024"
description = "A deterministic educational Product Quantization and ADC laboratory"
license = "MIT"

[[bin]]
name = "pqvs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

